<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>표지 이용 연령 추정기</title><link rel="stylesheet" href="/static/style.css"></head><body><main class="shell"><section class="hero"><p class="eyebrow">COVER AGE ESTIMATOR</p><h1>표지 이미지로<br><span>이용 연령을 추정</span>해 보세요</h1><p class="sub">CPU에서 실행되는 사전학습 이미지 모델을 사용합니다. 결과는 참고용 추정치입니다.</p></section><section class="card"><form id="form"><label class="drop" id="drop"><input id="file" name="file" type="file" accept="image/jpeg,image/png,image/webp"><span class="icon">＋</span><strong>이미지를 선택하거나 끌어다 놓으세요</strong><small>JPG, PNG, WEBP · 최대 10MB</small></label><div class="preview-wrap hidden" id="previewWrap"><img id="preview" alt="선택한 표지 미리보기"><button type="button" id="clear">다른 이미지</button></div><fieldset><legend>이용 연령 기준</legend><label><input type="radio" name="region" value="kr" checked><span>🇰🇷 한국</span></label><label><input type="radio" name="region" value="us"><span>🇺🇸 미국</span></label></fieldset><button class="primary" id="analyze" disabled>이미지 분석하기 <span>→</span></button></form><div id="status" class="status"></div><div id="result" class="result hidden"></div></section><p class="foot">⚠️ AI 추정 결과는 공식 등급 판정이 아닙니다. 최종 이용 판단은 해당 기관의 공식 기준을 확인하세요.</p></main><script src="/static/app.js"></script></body></html>
