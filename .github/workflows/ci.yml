name: Build and publish Docker image

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

env:
  IMAGE_NAME: cover-age-estimator

jobs:
  ml-evaluation:
    name: Evaluate preprocessing update
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install evaluation dependencies
        run: python -m pip install -r requirements.txt
      - name: Generate fixed synthetic dataset
        run: python scripts/generate_synthetic_dataset.py
      - name: Compare baseline and two preprocessing candidates
        run: python scripts/evaluate_preprocessing.py | tee artifacts/evaluation.log
      - name: Upload evaluation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-model-evaluation
          path: artifacts/

  build-and-test:
    name: Build and verify image
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (model load is checked in Dockerfile)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: cover-age-estimator:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start container
        run: docker run -d --rm --name cover-age-estimator-ci -p 8000:8000 cover-age-estimator:ci

      - name: Verify health endpoint
        shell: bash
        run: |
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/health; then
              echo
              exit 0
            fi
            sleep 2
          done
          docker logs cover-age-estimator-ci
          exit 1

      - name: Stop container
        if: always()
        run: docker rm -f cover-age-estimator-ci || true

  publish:
    name: Push image to Docker Hub
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    needs: [build-and-test, ml-evaluation]
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          logout: true

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Windows self-hosted runner
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    needs: publish
    runs-on: [self-hosted, windows]
    concurrency:
      group: local-production-deploy
      cancel-in-progress: false
    env:
      CONTAINER_NAME: cover-age-estimator
      HOST_PORT: '8000'
      IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/cover-age-estimator:latest
    steps:
      - name: Check Docker daemon
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host "Docker CLI:"; docker --version
          try { docker info | Out-Host; exit 0 } catch { Write-Host 'Docker daemon이 아직 응답하지 않습니다.' }

          $candidates = @(
            "$env:ProgramFiles\Docker\Docker\Docker Desktop.exe",
            "$env:ProgramW6432\Docker\Docker\Docker Desktop.exe",
            "$env:LOCALAPPDATA\Docker\Docker Desktop.exe"
          ) | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -Unique

          if ($candidates.Count -gt 0) {
            Write-Host "Docker Desktop 시작: $($candidates[0])"
            Start-Process -FilePath $candidates[0]
          } else {
            Write-Error 'Docker Desktop 실행 파일을 찾지 못했습니다. Self-hosted Runner에 Docker Desktop 또는 Docker Engine을 설치해야 합니다.'
            docker context ls
            Get-Service -Name 'com.docker.service','docker' -ErrorAction SilentlyContinue | Format-Table Name,Status,StartType
            exit 1
          }

          1..60 | ForEach-Object {
            Start-Sleep -Seconds 2
            try {
              docker info | Out-Host
              Write-Host 'Docker daemon 준비 완료'
              exit 0
            } catch {
              Write-Host "Docker daemon 대기 중... ($_/60)"
            }
          }
          Write-Error 'Docker Desktop을 시작했지만 120초 안에 Docker daemon이 준비되지 않았습니다.'
          docker context ls
          exit 1

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          logout: true

      - name: Pull published image
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference = 'Stop'
          docker pull $env:IMAGE

      - name: Start independent deployment monitor
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          New-Item -ItemType Directory -Force -Path verification_logs | Out-Null
          $scriptPath = Join-Path $env:GITHUB_WORKSPACE 'scripts\monitor_service.ps1'
          $logPath = Join-Path $env:GITHUB_WORKSPACE 'verification_logs\deploy.csv'
          $summaryPath = Join-Path $env:GITHUB_WORKSPACE 'verification_logs\deploy-summary.md'
          $stdoutPath = Join-Path $env:GITHUB_WORKSPACE 'verification_logs\monitor.stdout.log'
          $stderrPath = Join-Path $env:GITHUB_WORKSPACE 'verification_logs\monitor.stderr.log'
          $args = @('-NoProfile','-ExecutionPolicy','Bypass','-File',('"' + $scriptPath + '"'),'-Url','http://127.0.0.1:8000','-DurationSec','90','-LogPath',('"' + $logPath + '"'),'-SummaryPath',('"' + $summaryPath + '"'))
          $monitor = Start-Process powershell.exe -WindowStyle Hidden -WorkingDirectory $env:GITHUB_WORKSPACE -PassThru -ArgumentList $args -RedirectStandardOutput $stdoutPath -RedirectStandardError $stderrPath
          $monitor.Id | Set-Content -Encoding ascii verification_logs/monitor.pid
          Write-Host "Independent monitor PID: $($monitor.Id)"

      - name: Replace running container
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference = 'Stop'
          $existing = docker ps -aq --filter "name=^/$env:CONTAINER_NAME$"
          if ($existing) {
            docker rm -f $env:CONTAINER_NAME
          }
          docker run -d --restart unless-stopped --name $env:CONTAINER_NAME -e "APP_VERSION=$env:GITHUB_SHA" -p "${env:HOST_PORT}:8000" $env:IMAGE

      - name: Verify deployed service
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference = 'Stop'
          $healthy = $false
          1..30 | ForEach-Object {
            try {
              $response = Invoke-WebRequest -UseBasicParsing -Uri "http://127.0.0.1:$env:HOST_PORT/health" -TimeoutSec 3
              if ($response.StatusCode -eq 200) {
                Write-Host $response.Content
                $healthy = $true
                break
              }
            } catch {
              Start-Sleep -Seconds 2
            }
          }
          if (-not $healthy) {
            docker ps -a --filter "name=^/$env:CONTAINER_NAME$"
            docker logs $env:CONTAINER_NAME
            throw '배포된 컨테이너의 /health 응답을 확인하지 못했습니다.'
          }

      - name: Show container status on failure
        if: failure()
        continue-on-error: true
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          docker ps -a --filter "name=^/$env:CONTAINER_NAME$" 2>&1
          docker logs $env:CONTAINER_NAME 2>&1

      - name: Finish deployment monitor and publish summary
        if: always()
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          $pidFile='verification_logs/monitor.pid'
          if (Test-Path $pidFile) {
            $monitorPid=[int](Get-Content $pidFile)
            Wait-Process -Id $monitorPid -Timeout 120 -ErrorAction SilentlyContinue
          }
          if (Test-Path 'verification_logs/deploy-summary.md') {
            Get-Content 'verification_logs/deploy-summary.md' | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
          } else { Add-Content -Encoding UTF8 -Path $env:GITHUB_STEP_SUMMARY -Value "## Deployment verification`nMonitor summary was not produced." }

      - name: Upload deployment verification logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployment-verification-${{ github.run_id }}
          path: verification_logs/
          if-no-files-found: warn
